name: NextGen-Editor Build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  core:
    name: C++23 core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Install C++23 compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++-14
      - name: Configure Linux core
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14 -DNEXTGEN_EDITOR_BUILD_GUI=OFF
      - name: Configure Windows core
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DNEXTGEN_EDITOR_BUILD_GUI=OFF
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure

  windows-gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure full GUI
        shell: pwsh
        run: cmake -S . -B build -DNEXTGEN_EDITOR_BUILD_GUI=ON "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Package Windows application and runtime libraries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifact | Out-Null
          Copy-Item build/Release/map_editor.exe,build/Release/nif_probe.exe artifact/
          Get-ChildItem build/Release/*.dll -ErrorAction SilentlyContinue | Copy-Item -Destination artifact/
          Get-ChildItem build/vcpkg_installed/x64-windows/bin/*.dll -ErrorAction SilentlyContinue | Copy-Item -Destination artifact/
          Copy-Item docs/third-party artifact/licenses -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: NextGen-Editor-windows
          path: artifact/
