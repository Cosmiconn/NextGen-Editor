name: Original Fantasy NIF Assets

on:
  workflow_dispatch:
  push:
    paths:
      - tools/nif/generate_original_fantasy_assets.py
      - tools/nif/generate_walkable_fantasy_house.py
      - .github/workflows/original-fantasy-assets.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Generate compatibility baseline pack
        run: python3 tools/nif/generate_original_fantasy_assets.py --output build/original-fantasy-nifs

      - name: Generate production walkable house
        run: python3 tools/nif/generate_walkable_fantasy_house.py --output build/walkable-house-a

      - name: Verify generated assets
        run: |
          test "$(find build/original-fantasy-nifs -maxdepth 1 -name '*.nif' | wc -l)" -eq 13
          test -s build/NextGen_FiestaStyle_NIF_AssetPack_v1.zip
          test -s build/NextGen_WalkableHouse_A_Production.zip
          test -s build/walkable-house-a/NG_WalkableHouse_A.nif
          test "$(find build/walkable-house-a/textures -maxdepth 1 -name '*.dds' | wc -l)" -eq 12
          python3 - <<'PY'
          import json
          from pathlib import Path

          sig = b"Gamebryo File Format, Version 20.0.0.4\n"
          baseline = sorted(Path("build/original-fantasy-nifs").glob("*.nif"))
          assert len(baseline) == 13
          for path in baseline:
              data = path.read_bytes()
              assert data.startswith(sig), path
              assert len(data) > 128, path

          house = Path("build/walkable-house-a/NG_WalkableHouse_A.nif")
          data = house.read_bytes()
          assert data.startswith(sig)
          for marker in (b"#M", b"#CD", b"Floor#CD", b"Walls#CD", b"Stairs#CD", b"UpperFloor#CD"):
              assert marker in data, marker
          manifest = json.loads(Path("build/walkable-house-a/manifest.json").read_text())
          assert manifest["visible_parts"] >= 10, manifest
          assert manifest["collision_parts"] >= 5, manifest
          assert manifest["visible_triangles"] >= 2500, manifest
          assert manifest["collision_triangles"] >= 100, manifest
          assert len(manifest["textures"]) == 12, manifest
          for rel in manifest["textures"]:
              tex = Path("build/walkable-house-a") / rel
              assert tex.is_file() and tex.stat().st_size > 262000, tex
              assert tex.read_bytes()[:4] == b"DDS ", tex
          print("production house verified:", json.dumps(manifest, indent=2))
          PY

      - name: Upload production walkable house
        uses: actions/upload-artifact@v4
        with:
          name: NextGen-WalkableHouse-A-Production
          path: |
            build/NextGen_WalkableHouse_A_Production.zip
            build/walkable-house-a/NG_WalkableHouse_A.nif
            build/walkable-house-a/textures/*.dds
            build/walkable-house-a/manifest.json
            build/walkable-house-a/README.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload compatibility baseline pack
        uses: actions/upload-artifact@v4
        with:
          name: NextGen-FiestaStyle-NIF-AssetPack-v1
          path: |
            build/NextGen_FiestaStyle_NIF_AssetPack_v1.zip
            build/original-fantasy-nifs/*.nif
            build/original-fantasy-nifs/manifest.json
            build/original-fantasy-nifs/README.txt
          if-no-files-found: error
          retention-days: 30
